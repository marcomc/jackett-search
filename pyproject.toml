[project]
name = "jackett-search"
version = "0.3.0"
description = "Jackett search CLI with JSON, colour table, magnet links, and an interactive TUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["jackett", "torrent", "cli", "search", "magnet"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
